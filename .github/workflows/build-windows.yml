name: Build Windows installer
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: src/ClothingOrders/ClothingOrders.csproj

      - name: Validate embedded JavaScript syntax
        shell: pwsh
        run: |
          $html = Get-Content "src/ClothingOrders/wwwroot/index.html" -Raw
          $match = [regex]::Match($html, '<script>([\s\S]*?)</script>')
          if (-not $match.Success) { throw "Application JavaScript block was not found." }
          $scriptPath = Join-Path $env:RUNNER_TEMP "application.js"
          Set-Content -Path $scriptPath -Value $match.Groups[1].Value -NoNewline
          node --check $scriptPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish self-contained Windows app
        run: dotnet publish src/ClothingOrders/ClothingOrders.csproj --configuration Release --runtime win-x64 --self-contained true --output publish

      - name: Download Microsoft WebView2 Runtime bootstrapper
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "installer/WebView2Setup.exe"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer/ClothingOrders.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClothingOrders-Setup
          path: artifacts/ClothingOrders-Setup.exe
          if-no-files-found: error

      - name: Publish version to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.2.${{ github.run_number }}
          name: תומכי תורה — ישיבת דעת אהרן v3.2.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/ClothingOrders-Setup.exe
