name: Build Windows app
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/ClothingOrders/ClothingOrders.csproj
      - name: Build
        run: dotnet build src/ClothingOrders/ClothingOrders.csproj --configuration Release --no-restore
      - name: Publish
        run: dotnet publish src/ClothingOrders/ClothingOrders.csproj --configuration Release --no-build --output publish
      - uses: actions/upload-artifact@v4
        with:
          name: ClothingOrders-Windows
          path: publish/**